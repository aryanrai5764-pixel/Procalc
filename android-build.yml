name: Build Pro Calculator (APK and AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-22.04
    env:
      BUILDOZER_WARN_ON_ROOT: '0'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show project root
        run: |
          pwd
          ls -la
          test -f buildozer.spec || { echo 'ERROR: buildozer.spec is not in repository root'; exit 1; }
          test -f main.py || { echo 'ERROR: main.py is not in repository root'; exit 1; }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            cmake libffi-dev libssl-dev libltdl-dev

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install buildozer cython==0.29.36
          buildozer --version

      - name: Build debug APK
        run: buildozer -v android debug

      - name: Verify APK output
        run: |
          echo 'Searching for APK/AAB outputs after debug build:'
          find . -type f \( -name '*.apk' -o -name '*.aab' \) -not -path './.buildozer/*' -print
          test -n "$(find bin -maxdepth 1 -type f -name '*.apk' -print -quit 2>/dev/null)" || {
            echo 'ERROR: No APK found in bin/ after buildozer android debug.'
            echo 'Check the Buildozer output above for the actual build result.'
            exit 1
          }

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ProCalculator-APK
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build release AAB
        run: buildozer -v android release

      - name: Verify AAB output
        run: |
          echo 'Final build outputs:'
          find . -type f \( -name '*.apk' -o -name '*.aab' \) -not -path './.buildozer/*' -print
          test -n "$(find bin -maxdepth 1 -type f -name '*.aab' -print -quit 2>/dev/null)" || {
            echo 'ERROR: No AAB found in bin/ after buildozer android release.'
            echo 'Check android.release_artifact = aab and the release build log.'
            exit 1
          }

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: ProCalculator-AAB
          path: bin/*.aab
          if-no-files-found: error
          retention-days: 14
